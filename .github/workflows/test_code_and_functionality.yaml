name: Pylint and Unittest

on:
  push:
    branches:
      - main
      - development
      - GITHUB_ACTIONS

jobs:
  Lint_Unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pylint pyyaml

    - name: Analysing the code with pylint
      if: runner.os != 'Windows'
      run: |
        pylint --exit-zero $(find src/ -name "*.py" | xargs)

    - name: Test Via Unittest Module
      run: |
        python -m unittest tests/basic-function-test.py

  Command_Test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyyaml poetry

    - name: Install
      run: poetry install

    - name: Check Version
      run: |
        poetry run sshc --version

    - name: Check Help
      run: |
        poetry run sshc --help

    - name: Initiate Database
      run: |
        poetry run sshc init
